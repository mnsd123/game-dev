[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-factory"
version = "0.1.0"
description = "Pipeline edit video hàng loạt cho Smilee (ffmpeg + faster-whisper)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vf = "vf.cli:app"

[tool.setuptools]
packages = ["vf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: chạy model thật (faster-whisper), bỏ qua bằng -m 'not slow'"]
